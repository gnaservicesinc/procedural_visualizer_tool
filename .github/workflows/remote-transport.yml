name: Remote transport
on:
  push:
    paths: ['remote/**', 'scripts/sync-remote-clients.py', '.github/workflows/remote-transport.yml']
  pull_request:
    paths: ['remote/**', 'scripts/sync-remote-clients.py', '.github/workflows/remote-transport.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./remote
      - run: python -m unittest discover -s remote/tests -v
