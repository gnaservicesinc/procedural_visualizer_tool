name: Build desktop packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.8.3
  AQTINSTALL_VERSION: 3.3.0

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            qt-source: archive
            qt-host: linux
            qt-arch: linux_gcc_64
            qt-dir: gcc_64
            package-dir: procedural-visualizer-tool-linux-x86_64
            archive: procedural-visualizer-tool-linux-x86_64.tar.gz
          - name: Linux arm64
            os: ubuntu-24.04-arm
            qt-source: source
            package-dir: procedural-visualizer-tool-linux-arm64
            archive: procedural-visualizer-tool-linux-arm64.tar.gz
          - name: Windows x64
            os: windows-2022
            qt-source: archive
            qt-host: windows
            qt-arch: win64_msvc2022_64
            qt-dir: msvc2022_64
            cmake-arch: x64
            vcpkg-triplet: x64-windows-static
            package-dir: procedural-visualizer-tool-windows-x86_64
            archive: procedural-visualizer-tool-windows-x86_64.zip
          - name: Windows arm64
            os: windows-11-arm
            qt-source: archive
            qt-host: windows
            qt-arch: win64_msvc2022_arm64_cross_compiled
            qt-dir: msvc2022_arm64
            cmake-arch: ARM64
            vcpkg-triplet: arm64-windows-static
            package-dir: procedural-visualizer-tool-windows-arm64
            archive: procedural-visualizer-tool-windows-arm64.zip
          - name: macOS arm64
            os: macos-15
            qt-source: archive
            qt-host: mac
            qt-arch: clang_64
            qt-dir: macos
            archive: procedural-visualizer-tool-macos-arm64.zip

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(
            libgl1-mesa-dev
            libpng-dev
            libxcb-cursor0
            libxcb-icccm4
            libxcb-image0
            libxcb-keysyms1
            libxcb-render-util0
            libxcb-shape0
            libxcb-xinerama0
            libxkbcommon-x11-0
            xvfb
          )
          if [[ "${{ matrix.qt-source }}" == "source" ]]; then
            packages+=(
              libegl1-mesa-dev
              libfontconfig1-dev
              libfreetype-dev
              libx11-dev
              libx11-xcb-dev
              libxext-dev
              libxfixes-dev
              libxi-dev
              libxcb1-dev
              libxcb-cursor-dev
              libxcb-glx0-dev
              libxcb-icccm4-dev
              libxcb-image0-dev
              libxcb-keysyms1-dev
              libxcb-randr0-dev
              libxcb-render0-dev
              libxcb-render-util0-dev
              libxcb-shape0-dev
              libxcb-shm0-dev
              libxcb-sync-dev
              libxcb-util-dev
              libxcb-xfixes0-dev
              libxcb-xinerama0-dev
              libxcb-xkb-dev
              libxkbcommon-dev
              libxkbcommon-x11-dev
            )
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends "${packages[@]}"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" `
            install "libpng:${{ matrix.vcpkg-triplet }}"

      - name: Install Qt
        if: matrix.qt-source == 'archive'
        shell: bash
        run: |
          python3 -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python_exe="$GITHUB_WORKSPACE/.venv/Scripts/python.exe"
          else
            python_exe="$GITHUB_WORKSPACE/.venv/bin/python3"
          fi
          "$python_exe" -m pip install "aqtinstall==$AQTINSTALL_VERSION"
          "$python_exe" -m aqt install-qt \
            "${{ matrix.qt-host }}" desktop "$QT_VERSION" \
            "${{ matrix.qt-arch }}" --outputdir .qt
          qt_root="$GITHUB_WORKSPACE/.qt/$QT_VERSION/${{ matrix.qt-dir }}"
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"
          if [[ "${{ matrix.qt-arch }}" == *arm64_cross_compiled ]]; then
            "$python_exe" -m aqt install-qt \
              windows desktop "$QT_VERSION" win64_msvc2022_64 \
              --outputdir .qt-host
            qt_host_root="$GITHUB_WORKSPACE/.qt-host/$QT_VERSION/msvc2022_64"
            echo "QT_HOST_ROOT=$qt_host_root" >> "$GITHUB_ENV"
            echo "$qt_host_root/bin" >> "$GITHUB_PATH"
          fi

      - name: Restore source-built Qt for Linux arm64
        if: matrix.qt-source == 'source'
        id: qt-source-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .qt-source/${{ env.QT_VERSION }}
          key: qtbase-${{ env.QT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build Qt for Linux arm64
        if: matrix.qt-source == 'source' && steps.qt-source-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source_archive="$RUNNER_TEMP/qtbase-$QT_VERSION.tar.xz"
          source_directory="$RUNNER_TEMP/qtbase-$QT_VERSION"
          install_directory="$GITHUB_WORKSPACE/.qt-source/$QT_VERSION"
          curl --fail --location --retry 3 \
            --output "$source_archive" \
            "https://download.qt.io/archive/qt/6.8/$QT_VERSION/submodules/qtbase-everywhere-src-$QT_VERSION.tar.xz"
          echo "56001b905601bb9023d399f3ba780d7fa940f3e4861e496a7c490331f49e0b80  $source_archive" \
            | sha256sum --check --strict
          mkdir -p "$source_directory"
          tar -xJf "$source_archive" --strip-components=1 \
            -C "$source_directory"
          cmake -S "$source_directory" -B "$RUNNER_TEMP/qtbase-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$install_directory" \
            -DBUILD_SHARED_LIBS=ON \
            -DQT_BUILD_EXAMPLES=OFF \
            -DQT_BUILD_TESTS=OFF
          cmake --build "$RUNNER_TEMP/qtbase-build" --parallel
          cmake --install "$RUNNER_TEMP/qtbase-build"

      - name: Use source-built Qt for Linux arm64
        if: matrix.qt-source == 'source'
        shell: bash
        run: |
          qt_root="$GITHUB_WORKSPACE/.qt-source/$QT_VERSION"
          echo "QT_ROOT=$qt_root" >> "$GITHUB_ENV"
          echo "$qt_root/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Apple metal-cpp headers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          metal_cpp="$RUNNER_TEMP/metal-cpp"
          git init "$metal_cpp"
          git -C "$metal_cpp" remote add origin https://github.com/apple/metal-cpp.git
          git -C "$metal_cpp" fetch --depth=1 origin 9b4029d993648571595451f3b965c7c438fb7dc4
          git -C "$metal_cpp" checkout --detach FETCH_HEAD
          echo "METAL_CPP_DIR=$metal_cpp" >> "$GITHUB_ENV"

      - name: Configure Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DPVT_BUILD_CLI=ON \
            -DPVT_BUILD_QT_GUI=ON \
            -DPVT_DEPLOY_QT_RUNTIME=ON \
            -DPVT_ENABLE_METAL=OFF \
            -DBUILD_TESTING=ON

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $qtHostPath = $env:QT_HOST_ROOT -replace '\\', '/'
          cmake -S . -B build -G "Visual Studio 17 2022" `
            -A "${{ matrix.cmake-arch }}" -T ClangCL `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT" `
            -DQT_HOST_PATH="$qtHostPath" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="${{ matrix.vcpkg-triplet }}" `
            -DPVT_BUILD_CLI=ON `
            -DPVT_BUILD_QT_GUI=ON `
            -DPVT_DEPLOY_QT_RUNTIME=ON `
            -DPVT_ENABLE_METAL=OFF `
            -DBUILD_TESTING=ON

      - name: Configure macOS arm64 build
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DPVT_BUILD_CLI=ON \
            -DPVT_BUILD_QT_GUI=ON \
            -DPVT_ENABLE_DISTRIBUTION=ON \
            -DPVT_ENABLE_METAL=ON \
            -DPVT_METAL_CPP_DIR="$METAL_CPP_DIR" \
            -DBUILD_TESTING=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel

      - name: Build verified macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: cmake --build build --config Release --parallel --target distribution

      - name: Run Windows tests
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -C Release --output-on-failure --timeout 300

      - name: Run Linux tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Run macOS tests
        if: runner.os == 'macOS'
        shell: bash
        run: ctest --test-dir build --output-on-failure --timeout 300 -E '^pvt_gui_smoke$'

      - name: Install Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/package"
          if ldd ./package/bin/procedural-visualizer-tool \
              ./package/plugins/platforms/libqxcb.so | grep 'not found'; then
            exit 1
          fi
          xvfb-run --auto-servernum \
            ./package/bin/procedural-visualizer-tool --smoke-test
          ./package/bin/pvt-render --self-test

      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/package"
          $docDir = "$env:GITHUB_WORKSPACE/package/share/doc/ProceduralVisualizerTool"
          New-Item -ItemType Directory -Force -Path $docDir | Out-Null
          Copy-Item `
            "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg-triplet }}/share/libpng/copyright" `
            "$docDir/LIBPNG-LICENSE"
          Copy-Item `
            "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg-triplet }}/share/zlib/copyright" `
            "$docDir/ZLIB-LICENSE"
          $env:QT_QPA_PLATFORM = "offscreen"
          function Invoke-PackageCheck($filePath, $argument) {
            $process = Start-Process `
              -FilePath $filePath -ArgumentList $argument -PassThru
            if (-not $process.WaitForExit(30000)) {
              $process.Kill($true)
              throw "Package check timed out: $filePath $argument"
            }
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "Package check failed with exit code $($process.ExitCode): $filePath $argument"
            }
          }
          Invoke-PackageCheck `
            "$env:GITHUB_WORKSPACE/package/bin/procedural-visualizer-tool.exe" `
            "--smoke-test"
          Invoke-PackageCheck `
            "$env:GITHUB_WORKSPACE/package/bin/pvt-render.exe" "--self-test"

      - name: Verify and stage macOS package
        if: runner.os == 'macOS'
        timeout-minutes: 15
        shell: bash
        run: |
          app="build/Procedural Visualizer Tool.app"
          "$app/Contents/MacOS/Procedural Visualizer Tool" --smoke-test
          lipo "$app/Contents/MacOS/Procedural Visualizer Tool" \
            -verify_arch arm64
          lipo "$app/Contents/MacOS/pvt-render" -verify_arch arm64
          "$app/Contents/MacOS/pvt-render" --self-test
          package="$GITHUB_WORKSPACE/procedural-visualizer-tool-macos-arm64"
          mkdir -p "$package"
          ditto "$app" "$package/Procedural Visualizer Tool.app"
          cp README.md LICENSE "$package/"

      - name: Package Linux artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_name=${{ matrix.package-dir }}
          mv package "$package_name"
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive }}" "$package_name"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageName = "${{ matrix.package-dir }}"
          Move-Item package $packageName
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path $packageName -DestinationPath "dist/${{ matrix.archive }}"

      - name: Package macOS artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            procedural-visualizer-tool-macos-arm64 \
            "dist/${{ matrix.archive }}"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches product version
        shell: bash
        run: |
          product_version=$(tr -d '\r\n' < VERSION)
          if [[ "$GITHUB_REF_NAME" != "v$product_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION=$product_version" >&2
            exit 1
          fi

      - name: Download verified platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: procedural-visualizer-tool-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release notes
        shell: bash
        run: |
          cd release-assets
          sha256sum procedural-visualizer-tool-* > SHA256SUMS.txt
          cd ..
          product_version=${GITHUB_REF_NAME#v}
          release_target=${product_version%%-*}
          if [[ "$product_version" == *-* ]]; then
            release_summary="is a release candidate for $release_target."
          else
            release_summary="is the current stable release."
          fi
          cat > release-notes.md <<EOF
          Procedural Visualizer Tool $product_version $release_summary

          This release includes the Flow Workbench overhaul: seven focused Project, Starting Colors, Modifiers, Movement, Layer Effects, Post Effects, and Export workspaces with direct project settings and a compact collapsible Synchronization strip.

          The single ordered Layer Effects editor separates its catalog into Movement & Distortion, Light & Energy, Stylize, Particles, and Blur. New and randomized effects start on Texture; mapped-surface placement remains an explicit advanced per-effect choice rather than a duplicated Object FX workspace.

          Generated sources add Kaleidoscope and seamless deterministic Domain Warp controls. The ordered effect stack adds Glitch, Starburst, and Lens Distortion with CPU and Metal implementations, CLI controls, persistence, and parity coverage.

          Project/layer clock mixing is an explicit advanced opt-in and remains off for every old and new project. With mixing off, an active layer clock preserves the historical replace behavior. Deliberate mixing offers Replace, Add, Difference, continuous Soft XOR, and exact 24-bit XOR.

          Starting palettes now interoperate with GIMP GPL, Krita KPL, CSS, Python, PHP, Java, hex text, PNG, and FLOAT OpenEXR. Image imports ignore fully transparent pixels and exact decoded duplicates, retain first-occurrence order, and summarize accepted, skipped, unsupported, and lossy conversions. Code-style palette files are parsed as bounded data and never executed.

          Setup format 11 and project layer format 9 persist the new controls and palette metadata while retaining migration support for older projects. The public by-value configuration types grew, so this release advances the shared-library ABI to SONAME 3 and installed clients must rebuild.

          Downloads are attached for Apple Silicon macOS, x64 and ARM64 Linux, and x64 and ARM64 Windows. Every package was built and smoke-tested on its named native GitHub-hosted runner before this release was published. See SHA256SUMS.txt for integrity checks.

          The optional command-line renderer is named pvt-render. It is embedded inside the macOS application bundle and installed under bin/ in the Linux and Windows packages.

          Platform boundary: macOS includes the tested Metal renderer and AVFoundation/VideoToolbox movie export. Linux and Windows currently have no GPU backend and therefore use the CPU renderer and PNG/EXR sequence export while portable GPU and native movie backends are developed. The macOS package is ad-hoc signed but not notarized; Windows packages are not Authenticode-signed.
          EOF

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          product_version=${GITHUB_REF_NAME#v}
          if [[ "$product_version" == *-* ]]; then
            release_state=(--prerelease)
          else
            release_state=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --title "Procedural Visualizer Tool ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            "${release_state[@]}" \
            --verify-tag
